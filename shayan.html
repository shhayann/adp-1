<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: 1000px 100px 100px;
            grid-template-rows: 500px 50px;
            gap: 10px;
        }

        .box {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h2>Grid Layout</h2>

    <div class="grid">
        <div class="rectangle">Skcet</div>
        <div class="box">Shayan</div>
        <div class="box">ECE</div>
        <div class="box">133</div>
        <div class="box">Kovaipudur</div>
        <div class="circle">Hello</div>
    </div>

</body>
